function buildReportHTML(tour,findings,sigs){
  const tf=findings.filter(f=>f.tourId===tour.id);
  const si=sigs[tour.id+"_inspector"],sc=sigs[tour.id+"_contractor"],sr=sigs[tour.id+"_resident"];
  const rows=tf.map((f,i)=>{
    const col=SEV_COLOR[f.severity]||"#aaa";
    const photos=f.photos&&f.photos.length?'<div class="photos">'+f.photos.map(p=>'<img src="'+p+'"/>').join("")+"</div>":"";
    return '<div class="f" style="border-right-color:'+col+'">'
      +'<b>'+(i+1)+'. '+f.description+'</b><br/>'
      +'<span class="badge" style="background:'+col+'22;color:'+col+'">'+f.severity+'</span>'
      +'<span class="badge">'+f.area+'</span>'
      +(f.floor?'<span class="badge">קומה '+f.floor+'</span>':"")
      +(f.unitLoc?'<span class="badge">'+f.unitLoc+'</span>':"")
      +'<span class="badge">'+f.status+'</span><br/>'
      +'<span style="color:#4a7aaa;font-size:11px">'+(f.responsible?"👤 "+f.responsible+" ":"")+(f.deadline?"📅 "+f.deadline:"")+'</span>'
      +photos+'</div>';
  }).join("");
  const stats=SEVERITY.map(s=>{
    const c=tf.filter(f=>f.severity===s).length;
    return c?'<div class="stat"><div class="sn" style="color:'+SEV_COLOR[s]+'">'+c+'</div><div>'+s+'</div></div>':"";
  }).join("");
  return '<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8"><title>דוח סיור - '+tour.name+'</title>'
    +'<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;direction:rtl;color:#1e3a5f;margin:0;padding:20px;background:#fff;font-size:13px}'
    +'.hdr{display:flex;align-items:center;gap:16px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid #1565c0}'
    +'.logo{max-height:50px}h1{color:#1565c0;font-size:19px;margin:0 0 3px}.meta{color:#4a7aaa;font-size:11px}'
    +'.stats{display:flex;gap:10px;margin:14px 0;flex-wrap:wrap}.stat{background:#e8f1fb;border-radius:8px;padding:8px 14px;text-align:center;border:1px solid #bcd4f0;min-width:65px}.sn{font-size:19px;font-weight:900;line-height:1.2}'
    +'.f{border:1px solid #bcd4f0;border-right:4px solid #aaa;border-radius:8px;padding:10px;margin-bottom:8px;break-inside:avoid}'
    +'.badge{display:inline-block;padding:1px 7px;border-radius:10px;font-size:10px;margin-left:4px;border:1px solid #bcd4f0;background:#e8f1fb;color:#1565c0}'
    +'.photos{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}.photos img{width:85px;height:85px;object-fit:cover;border-radius:6px;border:1px solid #bcd4f0}'
    +'.sigs{display:flex;gap:16px;margin-top:26px;padding-top:14px;border-top:2px solid #bcd4f0;flex-wrap:wrap}'
    +'.sb{flex:1;min-width:120px;text-align:center}.sb img{max-width:150px;height:55px;object-fit:contain;border:1px solid #bcd4f0;border-radius:6px;background:#f8faff;margin:0 auto 4px;display:block}'
    +'.sl{border-bottom:1px solid #7fafd6;height:55px;margin-bottom:4px}.slbl{font-size:11px;color:#4a7aaa;font-weight:700}'
    +'@media print{body{padding:10px}@page{margin:1cm}}</style></head><body>'
    +'<div class="hdr"><img class="logo" src="data:image/png;base64,'+LOGO+'" alt="IDEAL"/>'
    +'<div><h1>דוח סיור פיקוח</h1><div class="meta"><b>פרויקט:</b> '+(tour.project||"—")
    +' | <b>סיור:</b> '+tour.name+' | <b>מפקח:</b> '+(tour.inspector||"—")
    +(tour.contractor?' | <b>קבלן:</b> '+tour.contractor:"")
    +' | <b>תאריך:</b> '+tour.date+' '+tour.time+'</div></div></div>'
    +'<div class="stats"><div class="stat"><div class="sn">'+tf.length+'</div><div>סה"כ</div></div>'
    +stats+'<div class="stat"><div class="sn" style="color:#059669">'+tf.filter(f=>f.status==="סגור").length+'</div><div>סגורים</div></div></div>'
    +'<hr style="border:none;border-top:1px solid #bcd4f0;margin:10px 0"/>'+rows
    +'<div class="sigs">'
    +'<div class="sb">'+(si?'<img src="'+si+'"/>':"<div class="sl"></div>")+'<div class="slbl">מפקח</div><div style="font-size:10px;color:#7fafd6">'+(tour.inspector||"")+'</div></div>'
    +'<div class="sb">'+(sc?'<img src="'+sc+'"/>':"<div class="sl"></div>")+'<div class="slbl">קבלן</div>'+(tour.contractor?'<div style="font-size:10px;color:#7fafd6">'+tour.contractor+"</div>":"")+'</div>'
    +'<div class="sb">'+(sr?'<img src="'+sr+'"/>':"<div class="sl"></div>")+'<div class="slbl">דייר</div></div>'
    +'</div></body></html>';
}

function printReport(tour,findings,sigs){
  const w=window.open("","_blank");
  if(w){w.document.write(buildReportHTML(tour,findings,sigs));w.document.close();setTimeout(()=>w.print(),800);}
}

function shareReport(tour,findings,sigs){
  const reportHTML=buildReportHTML(tour,findings,sigs);
  const w=window.open("","_blank");
  if(!w){alert("אפשר גישה לחלונות קופצים");return;}
  w.document.write(reportHTML);
  w.document.close();
  setTimeout(()=>{
    const banner=w.document.createElement("div");
    banner.style.cssText="position:fixed;top:0;left:0;right:0;background:#1565c0;color:#fff;padding:11px 15px;font-family:Arial;font-size:14px;direction:rtl;z-index:9999;display:flex;justify-content:space-between;align-items:center;gap:10px;";
    banner.innerHTML='<span>📄 לשמירה כ-PDF: לחץ על הכפתור ← בחר "שמור כ-PDF"</span><button onclick="window.print()" style="background:#fff;color:#1565c0;border:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px;white-space:nowrap;">🖨️ שמור PDF</button>';
    w.document.body.insertBefore(banner,w.document.body.firstChild);
    w.document.body.style.paddingTop="55px";
  },600);
}

function Confirm({msg,onOk,onCancel}){
  return <div style={{position:"fixed",inset:0,background:"#00000077",zIndex:500,display:"flex",alignItems:"center",justifyContent:"center",padding:20}}>
    <div style={{background:"#fff",borderRadius:16,padding:24,maxWidth:320,width:"100%",textAlign:"center"}}>
      <div style={{fontSize:34,marginBottom:10}}>🗑️</div>
      <div style={{fontWeight:700,fontSize:15,color:"#1e3a5f",marginBottom:20}}>{msg}</div>
      <div style={{display:"flex",gap:10}}>
        <button onClick={onOk} style={{...BDEL,flex:1,padding:"12px"}}>מחק</button>
        <button onClick={onCancel} style={{...BS,flex:1,padding:"12px"}}>ביטול</button>
      </div>
    </div>
  </div>;
}

function SigPad({label,existing,onSave,onCancel}){
  const ref=useRef(),draw=useRef(false),last=useRef(null);
  const [drawn,setDrawn]=useState(false);
  function pos(e,c){const r=c.getBoundingClientRect(),s=e.touches?e.touches[0]:e;return{x:(s.clientX-r.left)*(c.width/r.width),y:(s.clientY-r.top)*(c.height/r.height)};}
  function dn(e){e.preventDefault();draw.current=true;last.current=pos(e,ref.current);}
  function mv(e){e.preventDefault();if(!draw.current)return;const c=ref.current,ctx=c.getContext("2d"),p=pos(e,c);ctx.beginPath();ctx.moveTo(last.current.x,last.current.y);ctx.lineTo(p.x,p.y);ctx.strokeStyle="#1565c0";ctx.lineWidth=3;ctx.lineCap="round";ctx.stroke();last.current=p;setDrawn(true);}
  function up(){draw.current=false;}
  function clr(){ref.current.getContext("2d").clearRect(0,0,ref.current.width,ref.current.height);setDrawn(false);}
  return <div style={{background:"#e8f1fb",border:"1px solid #bcd4f0",borderRadius:12,padding:14,marginTop:10}}>
    <div style={{fontWeight:700,marginBottom:8,color:"#1e3a5f"}}>✍️ {label}</div>
    {existing&&<div style={{marginBottom:8,display:"flex",alignItems:"center",gap:8}}><img src={existing} style={{height:32,border:"1px solid #bcd4f0",borderRadius:6,background:"#fff"}}/><span style={{fontSize:12,color:"#059669"}}>✓ קיימת</span></div>}
    <canvas ref={ref} width={600} height={150} style={{background:"#fff",borderRadius:8,border:"2px dashed #7fafd6",width:"100%",touchAction:"none",display:"block"}} onMouseDown={dn} onMouseMove={mv} onMouseUp={up} onMouseLeave={up} onTouchStart={dn} onTouchMove={mv} onTouchEnd={up}/>
    <div style={{fontSize:11,color:"#7fafd6",marginTop:4,textAlign:"center"}}>חתמו כאן באצבע</div>
    <div style={{display:"flex",gap:8,marginTop:10}}>
      <button onClick={()=>drawn&&onSave(ref.current.toDataURL("image/png"))} style={{...BP,flex:1,opacity:drawn?1:0.5,padding:"10px"}}>✓ אשר</button>
      <button onClick={clr} style={{...BS,flex:1,padding:"10px"}}>🗑 נקה</button>
      <button onClick={onCancel} style={{...BS,flex:1,padding:"10px"}}>ביטול</button>
    </div>
  </div>;
}

function SigSection({tourId,sigs,setSigs}){
  const [active,setActive]=useState(null);
  const types=[{k:"inspector",l:"מפקח"},{k:"contractor",l:"קבלן"},{k:"resident",l:"דייר"}];
  return <div style={{marginTop:12}}>
    <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>חתימות:</div>
    <div style={{display:"flex",gap:8}}>
      {types.map(({k,l})=>{
        const s=sigs[tourId+"_"+k];
        return <div key={k} style={{flex:1}}>
          {s?<div style={{background:"#f0fff4",border:"1px solid #6ee7b7",borderRadius:10,padding:8,textAlign:"center",cursor:"pointer"}} onClick={()=>setActive(k)}>
            <img src={s} style={{height:28,maxWidth:"100%",objectFit:"contain"}}/><div style={{fontSize:10,color:"#059669",marginTop:2}}>✓ {l}</div>
          </div>:<button onClick={()=>setActive(k)} style={{...BS,width:"100%",padding:"9px 4px",fontSize:12}}>✍️ {l}</button>}
        </div>;
      })}
    </div>
    {active&&<SigPad label={types.find(t=>t.k===active)?.l} existing={sigs[tourId+"_"+active]} onSave={s=>{setSigs(p=>({...p,[tourId+"_"+active]:s}));setActive(null);}} onCancel={()=>setActive(null)}/>}
  </div>;
}

function StatusBadge({status}){
  const c={"פתוח":"#ef4444","בטיפול":"#eab308","סגור":"#22c55e"}[status]||"#9ca3af";
  return <div style={{background:c+"22",color:c,border:"1px solid "+c+"55",borderRadius:20,padding:"3px 10px",fontSize:12,whiteSpace:"nowrap"}}>{status}</div>;
}

function PhotoBtns({onAdd}){
  const fr=useRef(),cr=useRef();
  function handle(e){
    const files=Array.from(e.target.files);
    Promise.all(files.map(f=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(f);}))).then(onAdd);
    e.target.value="";
  }
  return <div style={{display:"flex",gap:8,marginTop:10}}>
    <input ref={cr} type="file" accept="image/*" capture="environment" style={{display:"none"}} onChange={handle}/>
    <input ref={fr} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handle}/>
    <button onClick={()=>cr.current?.click()} style={{...BP,flex:1,fontSize:13,padding:"11px"}}>📸 צלם</button>
    <button onClick={()=>fr.current?.click()} style={{...BS,flex:1,fontSize:13,padding:"11px"}}>🖼️ גלריה</button>
  </div>;
}

function FindingCard({f,onStatus,onDelete,onEdit,showTour}){
  const [open,setOpen]=useState(false);
  const [del,setDel]=useState(false);
  const [edit,setEdit]=useState(false);
  const [ed,setEd]=useState(null);
  const pr=useRef();
  const col=SEV_COLOR[f.severity]||"#9ca3af";
  const late=isOverdue(f.deadline)&&f.status!=="סגור";

  function startEdit(){setEd({...f});setEdit(true);setOpen(true);}
  function saveEdit(){if(!ed||!ed.description.trim())return;onEdit(f.id,ed);setEdit(false);setEd(null);}
  function handleEditFiles(e){
    const files=Array.from(e.target.files);
    Promise.all(files.map(fl=>new Promise(r=>{const rd=new FileReader();rd.onload=()=>r(rd.result);rd.readAsDataURL(fl);}))).then(imgs=>setEd(d=>({...d,photos:[...(d.photos||[]),...imgs]})));
    e.target.value="";
  }

  return <>
    {del&&<Confirm msg={"למחוק: ""+f.description.slice(0,25)+""?"} onOk={()=>{onDelete(f.id);setDel(false);}} onCancel={()=>setDel(false)}/>}
    <div style={{background:"#fff",border:"1px solid "+(late?"#fca5a5":col+"44"),borderRight:"4px solid "+(late?"#ef4444":col),borderRadius:10,marginBottom:10,overflow:"hidden",boxShadow:"0 1px 6px #1565c011"}}>
      <div onClick={()=>!edit&&setOpen(!open)} style={{padding:"13px",cursor:"pointer"}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:8}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:600,fontSize:15,marginBottom:6,color:"#1e3a5f"}}>{late&&<span style={{color:"#ef4444",marginLeft:6}}>⏰</span>}{f.description}</div>
            <div style={{display:"flex",flexWrap:"wrap",gap:5}}>
              <span style={{background:col+"22",color:col,borderRadius:20,padding:"2px 9px",fontSize:12}}>{f.severity}</span>
              <span style={{background:"#e8f1fb",color:"#4a7aaa",borderRadius:20,padding:"2px 9px",fontSize:12}}>{f.area}</span>
              {f.floor&&<span style={{background:"#e8f1fb",color:"#4a7aaa",borderRadius:20,padding:"2px 9px",fontSize:12}}>{"קומה "+f.floor}</span>}
              {f.unitLoc&&<span style={{background:"#ede9fe",color:"#7c3aed",borderRadius:20,padding:"2px 9px",fontSize:12}}>{f.unitLoc}</span>}
              {showTour&&f.tourName&&<span style={{background:"#e0f2fe",color:"#0369a1",borderRadius:20,padding:"2px 9px",fontSize:12}}>{f.tourName}</span>}
              {late&&<span style={{background:"#fef2f2",color:"#ef4444",borderRadius:20,padding:"2px 9px",fontSize:12}}>⏰ באיחור</span>}
            </div>
          </div>
          <StatusBadge status={f.status}/>
        </div>
      </div>
      {open&&!edit&&<div style={{borderTop:"1px solid #e0edf8",padding:"13px",background:"#f8faff"}}>
        {f.responsible&&<div style={{fontSize:13,color:"#4a7aaa",marginBottom:5}}>{"👤 "+f.responsible}</div>}
        {f.deadline&&<div style={{fontSize:13,color:late?"#ef4444":"#4a7aaa",marginBottom:5}}>{"📅 "+f.deadline+(late?" (באיחור!)":"")}</div>}
        {f.photos&&f.photos.length>0&&<div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:12}}>
          {f.photos.map((p,i)=><img key={i} src={p} style={{width:78,height:78,objectFit:"cover",borderRadius:8,border:"1px solid #bcd4f0",cursor:"pointer"}} onClick={()=>window.open(p,"_blank")}/>)}
        </div>}
        <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:12}}>
          {STATUSES.map(s=><button key={s} onClick={()=>onStatus(f.id,s)} style={{background:f.status===s?"#1565c0":"#e8f1fb",color:f.status===s?"#fff":"#1565c0",border:"1px solid "+(f.status===s?"#1565c0":"#bcd4f0"),borderRadius:8,padding:"7px 12px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}
        </div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={startEdit} style={{...BS,flex:1,padding:"10px",fontSize:13}}>✏️ ערוך</button>
          <button onClick={()=>setDel(true)} style={{...BDEL,flex:1,padding:"10px",fontSize:13}}>🗑 מחק</button>
        </div>
      </div>}
      {edit&&ed&&<div style={{borderTop:"1px solid #e0edf8",padding:"13px",background:"#f0f7ff"}}>
        <div style={{fontWeight:700,marginBottom:10,color:"#1e3a5f"}}>✏️ עריכת ממצא</div>
        <textarea value={ed.description} onChange={e=>setEd(d=>({...d,description:e.target.value}))} rows={3} style={{...IS,resize:"vertical",marginBottom:8}}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:8}}>
          <div><div style={LS}>חומרה</div><select value={ed.severity} onChange={e=>setEd(d=>({...d,severity:e.target.value}))} style={IS}>{SEVERITY.map(s=><option key={s}>{s}</option>)}</select></div>
          <div><div style={LS}>אזור</div><select value={ed.area} onChange={e=>setEd(d=>({...d,area:e.target.value}))} style={IS}>{AREAS.map(a=><option key={a}>{a}</option>)}</select></div>
          <div><div style={LS}>קומה</div><select value={ed.floor||""} onChange={e=>setEd(d=>({...d,floor:e.target.value}))} style={IS}><option value="">—</option>{FLOORS.map(fl=><option key={fl} value={fl}>{fl==="קרקע"?"קרקע":fl==="מרתף"?"מרתף":"קומה "+fl}</option>)}</select></div>
          <div><div style={LS}>מיקום בדירה</div><select value={ed.unitLoc||""} onChange={e=>setEd(d=>({...d,unitLoc:e.target.value}))} style={IS}><option value="">—</option>{UNIT_LOCS_DEFAULT.map(l=><option key={l}>{l}</option>)}</select></div>
          <div><div style={LS}>אחראי</div><input value={ed.responsible||""} onChange={e=>setEd(d=>({...d,responsible:e.target.value}))} style={IS}/></div>
          <div><div style={LS}>תאריך יעד</div><input type="date" value={ed.deadline||""} onChange={e=>setEd(d=>({...d,deadline:e.target.value}))} style={IS}/></div>
          <div style={{gridColumn:"span 2"}}><div style={LS}>סטטוס</div><select value={ed.status} onChange={e=>setEd(d=>({...d,status:e.target.value}))} style={IS}>{STATUSES.map(s=><option key={s}>{s}</option>)}</select></div>
        </div>
        {ed.photos&&ed.photos.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:10}}>
          {ed.photos.map((p,i)=><div key={i} style={{position:"relative"}}>
            <img src={p} style={{width:64,height:64,objectFit:"cover",borderRadius:8,border:"1px solid #bcd4f0"}}/>
            <button onClick={()=>setEd(d=>({...d,photos:d.photos.filter((_,j)=>j!==i)}))} style={{position:"absolute",top:-6,right:-6,background:"#ef4444",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,fontSize:12,cursor:"pointer",lineHeight:"20px",textAlign:"center",padding:0}}>✕</button>
          </div>)}
        </div>}
        <input ref={pr} type="file" accept="image/*" multiple style={{display:"none"}} onChange={handleEditFiles}/>
        <button onClick={()=>pr.current?.click()} style={{...BS,width:"100%",marginBottom:10,fontSize:13}}>📷 הוסף תמונות</button>
        <div style={{display:"flex",gap:8}}>
          <button onClick={saveEdit} style={{...BP,flex:1,padding:"11px"}}>💾 שמור</button>
          <button onClick={()=>{setEdit(false);setEd(null);}} style={{...BS,flex:1,padding:"11px"}}>ביטול</button>
        </div>
      </div>}
    </div>
  </>;
}

function FindingForm({finding,onChange,onSave,onCancel,onTemplates,extraAreas,onAddArea,extraUnits,onAddUnit}){
  const [custArea,setCustArea]=useState(false);const [areaVal,setAreaVal]=useState("");
  const [custUnit,setCustUnit]=useState(false);const [unitVal,setUnitVal]=useState("");
  const allAreas=[...AREAS,...(extraAreas||[])];
  const allUnits=[...UNIT_LOCS_DEFAULT,...(extraUnits||[])];
  return <div style={{background:"#e8f1fb",border:"1px solid #bcd4f0",borderRadius:12,padding:15,marginTop:10}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:12}}>
      <div style={{fontWeight:700,color:"#1e3a5f",fontSize:15}}>ממצא חדש</div>
      <button onClick={onTemplates} style={{background:"#ede9fe",border:"1px solid #c4b5fd",borderRadius:8,color:"#7c3aed",fontSize:13,padding:"5px 11px",cursor:"pointer",fontFamily:"inherit"}}>⚡ תבניות</button>
    </div>
    <textarea value={finding.description} onChange={e=>onChange({...finding,description:e.target.value})} placeholder="תיאור הממצא *" rows={3} style={{...IS,resize:"vertical"}}/>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginTop:9}}>
      <div><div style={LS}>חומרה</div><select value={finding.severity} onChange={e=>onChange({...finding,severity:e.target.value})} style={IS}>{SEVERITY.map(s=><option key={s}>{s}</option>)}</select></div>
      <div><div style={LS}>אזור</div>
        {!custArea
          ?<select value={finding.area} onChange={e=>{e.target.value==="__c"?setCustArea(true):onChange({...finding,area:e.target.value});}} style={IS}>
            {allAreas.map(a=><option key={a}>{a}</option>)}<option value="__c">+ הוסף...</option>
          </select>
          :<div style={{display:"flex",gap:6}}>
            <input value={areaVal} onChange={e=>setAreaVal(e.target.value)} placeholder="מיקום חדש" style={{...IS,flex:1}} autoFocus/>
            <button onClick={()=>{if(areaVal.trim()){onAddArea(areaVal.trim());onChange({...finding,area:areaVal.trim()});setCustArea(false);setAreaVal("");}}} style={{...BP,padding:"10px 11px"}}>✓</button>
            <button onClick={()=>{setCustArea(false);setAreaVal("");}} style={{...BS,padding:"10px 11px"}}>✕</button>
          </div>
        }
      </div>
      <div><div style={LS}>קומה</div>
        <select value={finding.floor} onChange={e=>onChange({...finding,floor:e.target.value})} style={IS}>
          <option value="">—</option>{FLOORS.map(fl=><option key={fl} value={fl}>{fl==="קרקע"?"קרקע":fl==="מרתף"?"מרתף":"קומה "+fl}</option>)}
        </select>
      </div>
      <div><div style={LS}>מיקום בדירה</div>
        {!custUnit
          ?<select value={finding.unitLoc||""} onChange={e=>{e.target.value==="__c"?setCustUnit(true):onChange({...finding,unitLoc:e.target.value});}} style={IS}>
            <option value="">—</option>{allUnits.map(l=><option key={l}>{l}</option>)}<option value="__c">+ הוסף...</option>
          </select>
          :<div style={{display:"flex",gap:6}}>
            <input value={unitVal} onChange={e=>setUnitVal(e.target.value)} placeholder="מיקום בדירה" style={{...IS,flex:1}} autoFocus/>
            <button onClick={()=>{if(unitVal.trim()){onAddUnit(unitVal.trim());onChange({...finding,unitLoc:unitVal.trim()});setCustUnit(false);setUnitVal("");}}} style={{...BP,padding:"10px 11px"}}>✓</button>
            <button onClick={()=>{setCustUnit(false);setUnitVal("");}} style={{...BS,padding:"10px 11px"}}>✕</button>
          </div>
        }
      </div>
      <div><div style={LS}>אחראי לתיקון</div><input value={finding.responsible} onChange={e=>onChange({...finding,responsible:e.target.value})} placeholder="שם / גורם" style={IS}/></div>
      <div><div style={LS}>תאריך יעד</div><input type="date" value={finding.deadline} onChange={e=>onChange({...finding,deadline:e.target.value})} style={IS}/></div>
    </div>
    <PhotoBtns onAdd={imgs=>onChange({...finding,photos:[...finding.photos,...imgs]})}/>
    {finding.photos.length>0&&<div style={{display:"flex",gap:6,flexWrap:"wrap",marginTop:9}}>
      {finding.photos.map((p,i)=><div key={i} style={{position:"relative"}}>
        <img src={p} style={{width:66,height:66,objectFit:"cover",borderRadius:8,border:"1px solid #bcd4f0"}}/>
        <button onClick={()=>onChange({...finding,photos:finding.photos.filter((_,j)=>j!==i)})} style={{position:"absolute",top:-6,right:-6,background:"#ef4444",color:"#fff",border:"none",borderRadius:"50%",width:20,height:20,fontSize:12,cursor:"pointer",lineHeight:"20px",textAlign:"center",padding:0}}>✕</button>
      </div>)}
    </div>}
    <div style={{display:"flex",gap:8,marginTop:13}}>
      <button onClick={onSave} style={{...BP,flex:1,padding:"13px"}}>שמור ממצא</button>
      <button onClick={onCancel} style={{...BS,flex:1,padding:"13px"}}>ביטול</button>
    </div>
  </div>;
}

function TemplatesPicker({templates,onSelect,onManage,onClose}){
  return <div style={{position:"fixed",inset:0,background:"#00000055",zIndex:200,display:"flex",alignItems:"flex-end"}} onClick={onClose}>
    <div style={{background:"#f0f7ff",borderRadius:"16px 16px 0 0",padding:18,width:"100%",maxHeight:"80vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontWeight:700,fontSize:16,color:"#1e3a5f"}}>⚡ תבניות</div>
        <div style={{display:"flex",gap:8}}>
          <button onClick={()=>{onClose();onManage();}} style={{...BS,fontSize:12,padding:"5px 10px"}}>⚙️ נהל</button>
          <button onClick={onClose} style={{background:"none",border:"none",color:"#7fafd6",fontSize:22,cursor:"pointer"}}>✕</button>
        </div>
      </div>
      {templates.length===0
        ?<div style={{textAlign:"center",color:"#7fafd6",padding:"30px 0"}}>אין תבניות.</div>
        :<div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
          {templates.map(t=><button key={t.id} onClick={()=>{onSelect(t);onClose();}} style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:10,padding:"13px",textAlign:"right",cursor:"pointer",fontFamily:"inherit",color:"#1e3a5f"}}>
            <div style={{fontSize:24,marginBottom:4}}>{t.icon}</div>
            <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{t.title}</div>
            <div style={{fontSize:11,color:"#7fafd6"}}>{t.description.slice(0,38)}</div>
            <div style={{marginTop:6}}><span style={{background:SEV_COLOR[t.severity]+"22",color:SEV_COLOR[t.severity],borderRadius:20,padding:"2px 8px",fontSize:11}}>{t.severity}</span></div>
          </button>)}
        </div>
      }
    </div>
  </div>;
}

function TemplatesManager({templates,onUpdate,onClose}){
  const [editing,setEditing]=useState(null);
  const [form,setForm]=useState({icon:"📋",title:"",description:"",severity:"בינוני",area:"כללי"});
  function startEdit(t){setEditing(t);setForm({icon:t.icon,title:t.title,description:t.description,severity:t.severity,area:t.area});}
  function startNew(){setEditing("new");setForm({icon:"📋",title:"",description:"",severity:"בינוני",area:"כללי"});}
  function save(){
    if(!form.title.trim())return;
    if(editing==="new"){onUpdate([...templates,{...form,id:gid()}]);}
    else{onUpdate(templates.map(t=>t.id===editing.id?{...editing,...form}:t));}
    setEditing(null);
  }
  return <div style={{position:"fixed",inset:0,background:"#00000066",zIndex:300,display:"flex",alignItems:"center",justifyContent:"center",padding:12}} onClick={onClose}>
    <div style={{background:"#f0f7ff",borderRadius:16,padding:16,width:"100%",maxWidth:520,maxHeight:"90vh",overflowY:"auto"}} onClick={e=>e.stopPropagation()}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
        <div style={{fontWeight:900,fontSize:16,color:"#1e3a5f"}}>ניהול תבניות</div>
        <button onClick={onClose} style={{background:"none",border:"none",color:"#7fafd6",fontSize:22,cursor:"pointer"}}>✕</button>
      </div>
      {editing
        ?<div style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:12,padding:14,marginBottom:14}}>
          <div style={{fontWeight:700,marginBottom:10}}>{editing==="new"?"תבנית חדשה":"עריכה"}</div>
          <div style={{marginBottom:10}}><div style={LS}>אייקון</div><div style={{display:"flex",flexWrap:"wrap",gap:6}}>{ICONS.map(ic=><button key={ic} onClick={()=>setForm(f=>({...f,icon:ic}))} style={{fontSize:21,background:form.icon===ic?"#1565c0":"#e8f1fb",border:"2px solid "+(form.icon===ic?"#1565c0":"#bcd4f0"),borderRadius:8,padding:"4px 7px",cursor:"pointer"}}>{ic}</button>)}</div></div>
          <div style={{marginBottom:8}}><div style={LS}>כותרת</div><input value={form.title} onChange={e=>setForm(f=>({...f,title:e.target.value}))} style={IS}/></div>
          <div style={{marginBottom:8}}><div style={LS}>תיאור</div><textarea value={form.description} onChange={e=>setForm(f=>({...f,description:e.target.value}))} rows={2} style={{...IS,resize:"vertical"}}/></div>
          <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8,marginBottom:12}}>
            <div><div style={LS}>חומרה</div><select value={form.severity} onChange={e=>setForm(f=>({...f,severity:e.target.value}))} style={IS}>{SEVERITY.map(s=><option key={s}>{s}</option>)}</select></div>
            <div><div style={LS}>אזור</div><select value={form.area} onChange={e=>setForm(f=>({...f,area:e.target.value}))} style={IS}>{AREAS.map(a=><option key={a}>{a}</option>)}</select></div>
          </div>
          <div style={{display:"flex",gap:8}}><button onClick={save} style={{...BP,flex:1,padding:"10px"}}>שמור</button><button onClick={()=>setEditing(null)} style={{...BS,flex:1,padding:"10px"}}>ביטול</button></div>
        </div>
        :<button onClick={startNew} style={{...BP,width:"100%",marginBottom:12}}>+ תבנית חדשה</button>
      }
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:8}}>
        {templates.map(t=><div key={t.id} style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:10,padding:12}}>
          <div style={{fontSize:22,marginBottom:3}}>{t.icon}</div>
          <div style={{fontWeight:700,fontSize:13,marginBottom:2}}>{t.title}</div>
          <div style={{fontSize:11,color:"#7fafd6",marginBottom:8}}>{t.description.slice(0,38)}</div>
          <div style={{display:"flex",gap:4}}>
            <button onClick={()=>startEdit(t)} style={{...BS,flex:1,padding:"6px",fontSize:12}}>✏️</button>
            <button onClick={()=>onUpdate(templates.filter(x=>x.id!==t.id))} style={{...BDEL,flex:1,padding:"6px",fontSize:12}}>🗑</button>
          </div>
        </div>)}
      </div>
    </div>
  </div>;
}

function OverdueAlert({findings}){
  const ov=findings.filter(f=>f.status!=="סגור"&&isOverdue(f.deadline));
  if(!ov.length)return null;
  return <div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:10,padding:"10px 13px",marginBottom:13,display:"flex",alignItems:"center",gap:10}}>
    <span style={{fontSize:20}}>⚠️</span>
    <div><div style={{fontWeight:700,color:"#dc2626",fontSize:14}}>{ov.length+" ממצאים באיחור"}</div>
    <div style={{fontSize:12,color:"#ef4444"}}>{ov.slice(0,2).map(f=>f.description).join(" • ")}</div></div>
  </div>;
}

function App(){
  const [view,setView]=useState("dashboard");
  const [tours,setTours]=useState(()=>lsGet("ideal_tours",[]));
  const [findings,setFindings]=useState(()=>lsGet("ideal_findings",[]));
  const [sigs,setSigsRaw]=useState(()=>lsGet("ideal_sigs",{}));
  const [templates,setTemplates]=useState(()=>lsGet("ideal_templates",DEF_TEMPLATES));
  const [extraAreas,setExtraAreas]=useState(()=>lsGet("ideal_areas",[]));
  const [extraUnits,setExtraUnits]=useState(()=>lsGet("ideal_units",[]));
  const [activeTour,setActiveTour]=useState(null);
  const [newF,setNewF]=useState(emptyF());
  const [showForm,setShowForm]=useState(false);
  const [showPicker,setShowPicker]=useState(false);
  const [showMgr,setShowMgr]=useState(false);
  const [selReport,setSelReport]=useState(null);
  const [delTourC,setDelTourC]=useState(null);
  const [filterSt,setFilterSt]=useState("הכל");
  const [filterSev,setFilterSev]=useState("הכל");
  const [nt,setNt]=useState({name:"",inspector:"",project:"",contractor:""});
  const [syncSt,setSyncSt]=useState("idle");
  const [reportAddId,setReportAddId]=useState(null);
  const [reportF,setReportF]=useState(emptyF());
  const syncTimer=useRef(null);

  useEffect(()=>lsSet("ideal_tours",tours),[tours]);
  useEffect(()=>lsSet("ideal_findings",findings),[findings]);
  useEffect(()=>lsSet("ideal_areas",extraAreas),[extraAreas]);
  useEffect(()=>lsSet("ideal_units",extraUnits),[extraUnits]);
  useEffect(()=>lsSet("ideal_templates",templates),[templates]);

  function setSigs(upd){setSigsRaw(prev=>{const n=typeof upd==="function"?upd(prev):upd;lsSet("ideal_sigs",n);return n;});}

  useEffect(()=>{
    if(syncTimer.current)clearTimeout(syncTimer.current);
    syncTimer.current=setTimeout(()=>pushToCloud(),8000);
    return ()=>clearTimeout(syncTimer.current);
  },[tours,findings,sigs,templates,extraAreas,extraUnits]);

  function getDB2(){
    try{if(!window._fbApp)window._fbApp=firebase.initializeApp(FB);return firebase.firestore(window._fbApp);}
    catch(e){try{return firebase.firestore();}catch{return null;}}
  }

  async function pushToCloud(){
    const db=getDB2();if(!db)return;
    try{
      await db.collection("users").doc("shared").set({tours,findings,sigs,templates,extraAreas,extraUnits,updatedAt:new Date().toISOString()});
      setSyncSt("synced");setTimeout(()=>setSyncSt("idle"),2000);
    }catch(e){setSyncSt("error");}
  }

  async function pullFromCloud(){
    const db=getDB2();if(!db){setSyncSt("error");return;}
    setSyncSt("syncing");
    try{
      const doc=await db.collection("users").doc("shared").get();
      if(doc.exists){
        const d=doc.data();
        const cn=(d.findings||[]).length,ln=findings.length;
        if(ln>cn){
          const ok=window.confirm("בענן יש "+cn+" ממצאים, במכשיר יש "+ln+". משיכה תחליף את הנתונים. להמשיך?");
          if(!ok){setSyncSt("idle");return;}
        }
        if(d.tours)setTours(d.tours);
        if(d.findings)setFindings(d.findings);
        if(d.sigs)setSigsRaw(d.sigs);
        if(d.templates)setTemplates(d.templates);
        if(d.extraAreas)setExtraAreas(d.extraAreas);
        if(d.extraUnits)setExtraUnits(d.extraUnits);
        setSyncSt("synced");setTimeout(()=>setSyncSt("idle"),3000);
      }else{await pushToCloud();}
    }catch(e){setSyncSt("error");}
  }

  function startTour(){
    if(!nt.name.trim())return;
    const t={id:gid(),name:nt.name,inspector:nt.inspector,project:nt.project,contractor:nt.contractor,date:todayStr(),time:nowTime(),findings:[],status:"active"};
    setTours(p=>[...p,t]);setActiveTour(t);setNt({name:"",inspector:"",project:"",contractor:""});setView("tour");
  }
  function endTour(){if(!activeTour)return;setTours(p=>p.map(t=>t.id===activeTour.id?{...t,status:"closed"}:t));setActiveTour(null);}
  function resumeTour(t){setActiveTour({...t,status:"active"});setTours(p=>p.map(x=>x.id===t.id?{...x,status:"active"}:x));setView("tour");}
  function delTourFn(id){setTours(p=>p.filter(t=>t.id!==id));setFindings(p=>p.filter(f=>f.tourId!==id));setSelReport(null);}

  function addFinding(tourId,finding,done){
    if(!finding.description.trim())return;
    const tour=tours.find(t=>t.id===tourId)||activeTour;
    const nf={...finding,id:gid(),tourId:tour?.id||null,tourName:tour?.name||"",date:todayStr()};
    setFindings(p=>[...p,nf]);
    if(tour){const u={...tour,findings:[...tour.findings,nf.id]};setTours(p=>p.map(t=>t.id===tour.id?u:t));if(activeTour?.id===tour.id)setActiveTour(u);}
    done();
  }
  function delFinding(id){setFindings(p=>p.filter(f=>f.id!==id));setTours(p=>p.map(t=>({...t,findings:t.findings.filter(fid=>fid!==id)})));}
  function editFinding(id,data){setFindings(p=>p.map(f=>f.id===id?{...f,...data}:f));}
  function addExtraArea(a){if(!AREAS.includes(a)&&!extraAreas.includes(a))setExtraAreas(p=>[...p,a]);}
  function addExtraUnit(u){if(!UNIT_LOCS_DEFAULT.includes(u)&&!extraUnits.includes(u))setExtraUnits(p=>[...p,u]);}

  const overdue=findings.filter(f=>f.status!=="סגור"&&isOverdue(f.deadline)).length;
  const filtered=findings.filter(f=>{if(filterSt!=="הכל"&&f.status!==filterSt)return false;if(filterSev!=="הכל"&&f.severity!==filterSev)return false;return true;});
  const stats={total:findings.length,open:findings.filter(f=>f.status==="פתוח").length,crit:findings.filter(f=>f.severity==="קריטי").length,tours:tours.length};
  const activeTours=tours.filter(t=>t.status==="active");



  return <div style={{fontFamily:"Heebo,sans-serif",direction:"rtl",minHeight:"100vh",background:"#e8f3fc",color:"#1e3a5f"}}>
    {showPicker&&<TemplatesPicker templates={templates} onSelect={t=>{setNewF(f=>({...f,description:t.description,severity:t.severity,area:t.area}));setShowForm(true);}} onManage={()=>setShowMgr(true)} onClose={()=>setShowPicker(false)}/>}
    {showMgr&&<TemplatesManager templates={templates} onUpdate={setTemplates} onClose={()=>setShowMgr(false)}/>}
    {delTourC&&<Confirm msg={"למחוק סיור ""+delTourC.name+"" וכל ממצאיו?"} onOk={()=>{delTourFn(delTourC.id);setDelTourC(null);}} onCancel={()=>setDelTourC(null)}/>}

    <div style={{background:"#fff",borderBottom:"2px solid #bcd4f0",padding:"0 13px",display:"flex",alignItems:"center",gap:10,height:58,position:"sticky",top:0,zIndex:100,boxShadow:"0 2px 10px #1565c011"}}>
      <img src={"data:image/png;base64,"+LOGO} alt="IDEAL" style={{height:40,objectFit:"contain"}}/>
      <div style={{width:1,height:30,background:"#bcd4f0"}}/>
      {activeTour&&<div style={{background:"#e8f1fb",border:"1px solid #7fafd6",borderRadius:20,padding:"2px 10px",fontSize:12,color:"#1565c0",display:"flex",alignItems:"center",gap:5}}>
        <span style={{width:7,height:7,borderRadius:"50%",background:"#22c55e",display:"inline-block",animation:"pulse 1.5s infinite"}}/>
        {activeTour.name}
      </div>}
      {overdue>0&&<div style={{background:"#fef2f2",border:"1px solid #fca5a5",borderRadius:20,padding:"2px 10px",fontSize:12,color:"#dc2626"}}>{"⏰ "+overdue}</div>}
      <div style={{marginRight:"auto",display:"flex",gap:2}}>
        {[{id:"dashboard",l:"בקרה"},{id:"tour",l:"סיור"},{id:"findings",l:"ממצאים"},{id:"report",l:"דוחות"}].map(v=>
          <button key={v.id} onClick={()=>setView(v.id)} style={{background:view===v.id?"#1565c0":"transparent",color:view===v.id?"#fff":"#4a7aaa",border:"none",borderRadius:8,padding:"5px 10px",fontSize:13,fontWeight:view===v.id?700:400,cursor:"pointer",fontFamily:"inherit"}}>{v.l}</button>
        )}
      </div>
    </div>

    <div style={{maxWidth:720,margin:"0 auto",padding:"13px 12px 100px"}}>

      {view==="dashboard"&&<div>
        <div style={{fontSize:21,fontWeight:900,marginBottom:2}}>לוח בקרה</div>
        <div style={{color:"#7fafd6",fontSize:12,marginBottom:13}}>{new Date().toLocaleDateString("he-IL",{weekday:"long",year:"numeric",month:"long",day:"numeric"})}</div>
        <div style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:12,padding:"11px 13px",marginBottom:13,display:"flex",alignItems:"center",gap:10}}>
          <div style={{flex:1}}>
            <div style={{fontWeight:700,fontSize:13}}>☁️ סנכרון ענן</div>
            <div style={{fontSize:11,color:"#7fafd6"}}>{syncSt==="syncing"?"🔄 מסנכרן...":syncSt==="synced"?"✓ סונכרן":syncSt==="error"?"⚠️ שגיאה":"שומר אוטומטית | קבל = משוך ממכשיר אחר"}</div>
          </div>
          <button onClick={pullFromCloud} style={{...BS,padding:"8px 11px",fontSize:12}} disabled={syncSt==="syncing"}>⬇️ קבל</button>
          <button onClick={pushToCloud} style={{...BP,padding:"8px 11px",fontSize:12}} disabled={syncSt==="syncing"}>⬆️ שלח</button>
        </div>
        <OverdueAlert findings={findings}/>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:10,marginBottom:15}}>
          {[{l:'סה"כ',v:stats.total,ic:"📋",c:"#1565c0"},{l:"פתוחים",v:stats.open,ic:"🔓",c:"#f97316"},{l:"קריטיים",v:stats.crit,ic:"🚨",c:"#ef4444"},{l:"סיורים",v:stats.tours,ic:"👷",c:"#059669"}].map(s=>
            <div key={s.l} style={{background:"#fff",border:"1px solid "+s.c+"33",borderRadius:13,padding:"14px",display:"flex",alignItems:"center",gap:11,boxShadow:"0 2px 8px #1565c009"}}>
              <div style={{fontSize:28}}>{s.ic}</div>
              <div><div style={{fontSize:26,fontWeight:900,color:s.c,lineHeight:1}}>{s.v}</div><div style={{fontSize:11,color:"#7fafd6",marginTop:2}}>{s.l}</div></div>
            </div>
          )}
        </div>
        {activeTours.length>0&&<div style={{marginBottom:15}}>
          <div style={{fontSize:14,fontWeight:700,marginBottom:9,color:"#059669"}}>🟢 סיורים פעילים</div>
          {activeTours.map(t=><div key={t.id} style={{background:"#f0fff4",border:"2px solid #6ee7b7",borderRadius:12,padding:13,marginBottom:8}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:900,fontSize:16}}>{t.name}</div>
                <div style={{fontSize:13,color:"#4a7aaa"}}>{t.project}</div>
                <div style={{fontSize:12,color:"#7fafd6",marginTop:2}}>{t.inspector+(t.contractor?" | "+t.contractor:"")+" • "+t.date+" "+t.time}</div>
              </div>
              <div style={{background:"#dcfce7",border:"1px solid #6ee7b7",borderRadius:20,padding:"3px 10px",fontSize:12,color:"#059669"}}>{findings.filter(f=>f.tourId===t.id).length+" ממצאים"}</div>
            </div>
            <button onClick={()=>resumeTour(t)} style={{...BP,width:"100%",marginTop:11,fontSize:14,padding:"11px",background:"#059669"}}>▶ המשך סיור</button>
          </div>)}
        </div>}
        <div style={{fontSize:14,fontWeight:700,marginBottom:9}}>ממצאים אחרונים</div>
        {findings.slice(-3).reverse().map(f=><FindingCard key={f.id} f={f} onStatus={(id,s)=>editFinding(id,{status:s})} onDelete={delFinding} onEdit={editFinding}/>)}
        {findings.length===0&&<div style={{textAlign:"center",color:"#7fafd6",padding:"28px 0",fontSize:14}}>אין ממצאים עדיין.<br/>התחל סיור חדש.</div>}
        <div style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:13,padding:15,marginTop:15,boxShadow:"0 2px 8px #1565c009"}}>
          <div style={{fontWeight:700,marginBottom:11,fontSize:15}}>פתח סיור חדש</div>
          <input value={nt.project} onChange={e=>setNt(n=>({...n,project:e.target.value}))} placeholder="שם הפרויקט" style={IS}/>
          <input value={nt.name} onChange={e=>setNt(n=>({...n,name:e.target.value}))} placeholder="שם / מספר הסיור" style={{...IS,marginTop:9}}/>
          <input value={nt.inspector} onChange={e=>setNt(n=>({...n,inspector:e.target.value}))} placeholder="שם המפקח" style={{...IS,marginTop:9}}/>
          <input value={nt.contractor} onChange={e=>setNt(n=>({...n,contractor:e.target.value}))} placeholder="שם הקבלן" style={{...IS,marginTop:9}}/>
          <button onClick={startTour} style={{...BP,width:"100%",marginTop:11,fontSize:15,padding:"13px"}}>▶ התחל סיור</button>
        </div>
      </div>}

      {view==="tour"&&<div>
        {!activeTour?<div style={{textAlign:"center",padding:"50px 0",color:"#7fafd6"}}>
          <div style={{fontSize:46,marginBottom:11}}>👷</div>
          <div style={{fontWeight:700,marginBottom:11,fontSize:16}}>אין סיור פעיל</div>
          <button onClick={()=>setView("dashboard")} style={{...BS,fontSize:15,padding:"12px 22px"}}>פתח סיור חדש</button>
          {activeTours.length>0&&<div style={{marginTop:22}}>
            <div style={{fontSize:14,fontWeight:700,color:"#059669",marginBottom:9}}>סיורים פעילים:</div>
            {activeTours.map(t=><button key={t.id} onClick={()=>resumeTour(t)} style={{...BP,width:"100%",marginBottom:8,background:"#059669",fontSize:14}}>{"▶ המשך: "+t.name}</button>)}
          </div>}
        </div>:<div>
          <div style={{background:"#fff",border:"1px solid #7fafd6",borderRadius:13,padding:15,marginBottom:13,boxShadow:"0 2px 8px #1565c011"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start"}}>
              <div>
                <div style={{fontWeight:900,fontSize:17}}>{activeTour.name}</div>
                <div style={{color:"#4a7aaa",fontSize:13}}>{activeTour.project}</div>
                <div style={{color:"#7fafd6",fontSize:12,marginTop:3}}>{activeTour.inspector+(activeTour.contractor?" | קבלן: "+activeTour.contractor:"")+" • "+activeTour.date+" "+activeTour.time}</div>
              </div>
              <div style={{background:"#e8f1fb",border:"1px solid #7fafd6",borderRadius:20,padding:"3px 11px",fontSize:12,color:"#1565c0"}}>{activeTour.findings.length+" ממצאים"}</div>
            </div>
            <SigSection tourId={activeTour.id} sigs={sigs} setSigs={setSigs}/>
            <button onClick={endTour} style={{...BS,marginTop:11,width:"100%",fontSize:14}}>✓ סיים סיור</button>
          </div>
          {findings.filter(f=>f.tourId===activeTour.id).map(f=><FindingCard key={f.id} f={f} onStatus={(id,s)=>editFinding(id,{status:s})} onDelete={delFinding} onEdit={editFinding}/>)}
          {!showForm
            ?<div style={{display:"flex",gap:9,marginTop:9}}>
              <button onClick={()=>setShowForm(true)} style={{...BP,flex:2,padding:14,fontSize:15}}>+ הוסף ממצא</button>
              <button onClick={()=>setShowPicker(true)} style={{...BS,flex:1,padding:14,fontSize:13}}>⚡ תבנית</button>
            </div>
            :<FindingForm finding={newF} onChange={setNewF}
              onSave={()=>addFinding(activeTour.id,newF,()=>{setNewF(emptyF());setShowForm(false);})}
              onCancel={()=>setShowForm(false)}
              onTemplates={()=>setShowPicker(true)} extraAreas={extraAreas} onAddArea={addExtraArea}
              extraUnits={extraUnits} onAddUnit={addExtraUnit}/>
          }
        </div>}
      </div>}

      {view==="findings"&&<div>
        <div style={{fontSize:21,fontWeight:900,marginBottom:13}}>כל הממצאים</div>
        <OverdueAlert findings={findings}/>
        <div style={{marginBottom:13}}>
          <div style={{fontSize:12,color:"#7fafd6",marginBottom:5}}>סטטוס</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap",marginBottom:9}}>
            {["הכל",...STATUSES].map(s=><button key={s} onClick={()=>setFilterSt(s)} style={{background:filterSt===s?"#1565c0":"#fff",color:filterSt===s?"#fff":"#4a7aaa",border:"1px solid "+(filterSt===s?"#1565c0":"#bcd4f0"),borderRadius:8,padding:"6px 13px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}
          </div>
          <div style={{fontSize:12,color:"#7fafd6",marginBottom:5}}>חומרה</div>
          <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
            {["הכל",...SEVERITY].map(s=><button key={s} onClick={()=>setFilterSev(s)} style={{background:filterSev===s?"#1565c0":"#fff",color:filterSev===s?"#fff":"#4a7aaa",border:"1px solid "+(filterSev===s?"#1565c0":"#bcd4f0"),borderRadius:8,padding:"6px 13px",fontSize:13,cursor:"pointer",fontFamily:"inherit"}}>{s}</button>)}
          </div>
        </div>
        {filtered.length===0?<div style={{textAlign:"center",color:"#7fafd6",padding:"38px 0"}}>לא נמצאו ממצאים</div>:filtered.map(f=><FindingCard key={f.id} f={f} onStatus={(id,s)=>editFinding(id,{status:s})} onDelete={delFinding} onEdit={editFinding} showTour/>)}
      </div>}

      {view==="report"&&<div>
        <div style={{fontSize:21,fontWeight:900,marginBottom:13}}>דוחות סיור</div>
        {tours.length===0?<div style={{textAlign:"center",color:"#7fafd6",padding:"38px 0"}}>אין סיורים עדיין</div>:tours.map(tour=>{
          const tf=findings.filter(f=>f.tourId===tour.id);
          const isExp=selReport===tour.id;
          const hasSigs=["inspector","contractor","resident"].some(k=>sigs[tour.id+"_"+k]);
          const isAdding=reportAddId===tour.id;
          return <div key={tour.id} style={{background:"#fff",border:"1px solid #bcd4f0",borderRadius:13,marginBottom:11,overflow:"hidden",boxShadow:"0 2px 8px #1565c009"}}>
            <div style={{padding:15,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
              <div onClick={()=>setSelReport(isExp?null:tour.id)} style={{flex:1,cursor:"pointer"}}>
                <div style={{fontWeight:700,fontSize:15}}>{tour.name}</div>
                <div style={{fontSize:13,color:"#7fafd6"}}>{tour.project+(tour.contractor?" | "+tour.contractor:"")+" • "+tour.inspector+" • "+tour.date}</div>
              </div>
              <div style={{display:"flex",gap:8,alignItems:"center"}}>
                {hasSigs&&<span style={{fontSize:13,color:"#059669"}}>✍️</span>}
                {tour.status==="active"&&<span style={{background:"#dcfce7",color:"#059669",border:"1px solid #6ee7b7",borderRadius:20,padding:"2px 8px",fontSize:11}}>פעיל</span>}
                <div style={{background:"#ede9fe",color:"#7c3aed",borderRadius:20,padding:"3px 11px",fontSize:13}}>{tf.length+" ממצאים"}</div>
                {!isExp&&<button onClick={()=>setDelTourC(tour)} style={{...BDEL,padding:"4px 8px",fontSize:12}}>🗑</button>}
                <span onClick={()=>setSelReport(isExp?null:tour.id)} style={{color:"#7fafd6",fontSize:18,cursor:"pointer"}}>{isExp?"▲":"▼"}</span>
              </div>
            </div>
            {isExp&&<div style={{borderTop:"1px solid #e0edf8",padding:"13px"}}>
              <div style={{display:"flex",gap:8,flexWrap:"wrap",marginBottom:11}}>
                {SEVERITY.map(s=>{const c=tf.filter(f=>f.severity===s).length;return c?<div key={s} style={{background:SEV_COLOR[s]+"22",border:"1px solid "+SEV_COLOR[s]+"55",borderRadius:20,padding:"3px 10px",fontSize:12,color:SEV_COLOR[s]}}>{s+": "+c}</div>:null;})}
                <div style={{background:"#d1fae5",border:"1px solid #6ee7b7",borderRadius:20,padding:"3px 10px",fontSize:12,color:"#059669"}}>{"סגורים: "+tf.filter(f=>f.status==="סגור").length}</div>
              </div>
              <div style={{display:"flex",gap:11,marginBottom:11,flexWrap:"wrap"}}>
                {["inspector","contractor","resident"].map(k=>{const s=sigs[tour.id+"_"+k];const l=k==="inspector"?"מפקח":k==="contractor"?"קבלן":"דייר";return s?<div key={k} style={{textAlign:"center"}}><img src={s} style={{height:38,border:"1px solid #bcd4f0",borderRadius:6,background:"#f8faff",display:"block"}}/><div style={{fontSize:10,color:"#059669",marginTop:2}}>{"✓ "+l}</div></div>:null;})}
              </div>
              {tf.length===0?<div style={{color:"#7fafd6",fontSize:14,marginBottom:11}}>אין ממצאים בסיור זה</div>:tf.map(f=><FindingCard key={f.id} f={f} onStatus={(id,s)=>editFinding(id,{status:s})} onDelete={delFinding} onEdit={editFinding}/>)}
              {!isAdding
                ?<button onClick={()=>{setReportAddId(tour.id);setReportF(emptyF());}} style={{...BS,width:"100%",marginBottom:11,fontSize:14}}>+ הוסף ממצא לסיור</button>
                :<FindingForm finding={reportF} onChange={setReportF}
                  onSave={()=>addFinding(tour.id,reportF,()=>{setReportF(emptyF());setReportAddId(null);})}
                  onCancel={()=>setReportAddId(null)}
                  onTemplates={()=>setShowPicker(true)} extraAreas={extraAreas} onAddArea={addExtraArea}
                  extraUnits={extraUnits} onAddUnit={addExtraUnit}/>
              }
              <div style={{display:"flex",gap:8,marginTop:8}}>
                <button onClick={()=>printReport(tour,findings,sigs)} style={{...BP,flex:2,fontSize:14,padding:"13px"}}>🖨️ הדפס / PDF</button>
                <button onClick={()=>shareReport(tour,findings,sigs)} style={{...BS,flex:1,fontSize:14,padding:"13px"}}>📤 שתף</button>
                <button onClick={()=>setDelTourC(tour)} style={{...BDEL,padding:"13px",fontSize:14}}>🗑</button>
              </div>
            </div>}
          </div>;
        })}
      </div>}
    </div>

    <div style={{position:"fixed",bottom:0,right:0,left:0,background:"#fff",borderTop:"2px solid #bcd4f0",display:"flex",zIndex:100,boxShadow:"0 -2px 10px #1565c011"}}>
      {[{id:"dashboard",l:"בקרה",ic:"📊"},{id:"tour",l:"סיור",ic:"👷"},{id:"findings",l:"ממצאים",ic:"📋"},{id:"report",l:"דוחות",ic:"📄"}].map(v=>
        <button key={v.id} onClick={()=>setView(v.id)} style={{flex:1,background:"transparent",border:"none",padding:"9px 0 13px",cursor:"pointer",fontFamily:"inherit",color:view===v.id?"#1565c0":"#9ca3af",fontWeight:view===v.id?700:400,borderTop:view===v.id?"3px solid #1565c0":"3px solid transparent"}}>
          <div style={{fontSize:21}}>{v.ic}</div>
          <div style={{fontSize:11,marginTop:2}}>{v.l}</div>
        </button>
      )}
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
