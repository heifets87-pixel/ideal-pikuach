  var tf=findings.filter(function(f){return f.tourId===tour.id;});
  var si=sigs[tour.id+"_inspector"]||"",sc=sigs[tour.id+"_contractor"]||"",sr=sigs[tour.id+"_resident"]||"";
  var rows=tf.map(function(f,i){
    var col=SEVC[f.severity]||"#aaa";
    var photos=f.photos&&f.photos.length?'<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+f.photos.map(function(p){return '<img src="'+p+'" style="width:85px;height:85px;object-fit:cover;border-radius:6px;border:1px solid #bcd4f0"/>';}).join("")+"</div>":"";
    return '<div style="border:1px solid #bcd4f0;border-right:4px solid '+col+';border-radius:8px;padding:10px;margin-bottom:8px;page-break-inside:avoid">'
      +'<b>'+(i+1)+'. '+(f.description||"")+'</b><br/>'
      +'<span style="background:'+col+'22;color:'+col+';border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">'+f.severity+'</span>'
      +'<span style="background:#e8f1fb;color:#1565c0;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">'+f.area+'</span>'
      +(f.floor?'<span style="background:#e8f1fb;color:#1565c0;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">קומה '+f.floor+'</span>':"")
      +(f.unitLoc?'<span style="background:#ede9fe;color:#7c3aed;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">'+f.unitLoc+'</span>':"")
      +'<span style="background:#e8f1fb;color:#1565c0;border-radius:10px;padding:1px 7px;font-size:10px;margin-left:4px">'+f.status+'</span><br/>'
      +'<span style="color:#4a7aaa;font-size:11px">'+(f.responsible?"👤 "+f.responsible+" ":"")+(f.deadline?"📅 "+f.deadline:"")+'</span>'
      +photos+'</div>';
  }).join("");
  var stats=SEV.map(function(s){var c=tf.filter(function(f){return f.severity===s;}).length;return c?'<div style="background:#e8f1fb;border-radius:8px;padding:8px 14px;text-align:center;border:1px solid #bcd4f0"><div style="font-size:19px;font-weight:900;color:'+SEVC[s]+'">'+c+'</div><div>'+s+'</div></div>':"";}).join("");
  var closed=tf.filter(function(f){return f.status==="סגור";}).length;
  return '<!DOCTYPE html><html dir="rtl" lang="he"><head><meta charset="UTF-8"><title>דוח '+tour.name+'</title>'
    +'<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;direction:rtl;color:#1e3a5f;margin:0;padding:20px;background:#fff;font-size:13px}@media print{body{padding:10px}@page{margin:1cm}}</style>'
    +'</head><body>'
    +'<div style="display:flex;align-items:center;gap:16px;margin-bottom:16px;padding-bottom:14px;border-bottom:2px solid #1565c0">'
    +'<img src="data:image/png;base64,'+LOGO+'" style="max-height:50px"/>'
    +'<div><h1 style="color:#1565c0;font-size:19px;margin:0 0 3px">דוח סיור פיקוח</h1>'
    +'<div style="color:#4a7aaa;font-size:11px"><b>פרויקט:</b> '+(tour.project||"—")+' | <b>סיור:</b> '+tour.name+' | <b>מפקח:</b> '+(tour.inspector||"—")+(tour.contractor?' | <b>קבלן:</b> '+tour.contractor:"")
    +' | <b>תאריך:</b> '+tour.date+' '+tour.time+'</div></div></div>'
    +'<div style="display:flex;gap:10px;margin:14px 0;flex-wrap:wrap"><div style="background:#e8f1fb;border-radius:8px;padding:8px 14px;text-align:center;border:1px solid #bcd4f0"><div style="font-size:19px;font-weight:900">'+tf.length+'</div><div>סה"כ</div></div>'
    +stats+'<div style="background:#e8f1fb;border-radius:8px;padding:8px 14px;text-align:center;border:1px solid #bcd4f0"><div style="font-size:19px;font-weight:900;color:#059669">'+closed+'</div><div>סגורים</div></div></div>'
    +'<hr style="border:none;border-top:1px solid #bcd4f0;margin:10px 0"/>'+rows
    +'<div style="display:flex;gap:16px;margin-top:26px;padding-top:14px;border-top:2px solid #bcd4f0;flex-wrap:wrap">'
    +'<div style="flex:1;min-width:120px;text-align:center">'+(si?'<img src="'+si+'" style="max-width:150px;height:55px;object-fit:contain;border:1px solid #bcd4f0;border-radius:6px;margin:0 auto 4px;display:block"/>':"<div style='border-bottom:1px solid #7fafd6;height:55px;margin-bottom:4px'></div>")+'<div style="font-size:11px;color:#4a7aaa;font-weight:700">מפקח</div></div>'
    +'<div style="flex:1;min-width:120px;text-align:center">'+(sc?'<img src="'+sc+'" style="max-width:150px;height:55px;object-fit:contain;border:1px solid #bcd4f0;border-radius:6px;margin:0 auto 4px;display:block"/>':"<div style='border-bottom:1px solid #7fafd6;height:55px;margin-bottom:4px'></div>")+'<div style="font-size:11px;color:#4a7aaa;font-weight:700">קבלן</div></div>'
    +'<div style="flex:1;min-width:120px;text-align:center">'+(sr?'<img src="'+sr+'" style="max-width:150px;height:55px;object-fit:contain;border:1px solid #bcd4f0;border-radius:6px;margin:0 auto 4px;display:block"/>':"<div style='border-bottom:1px solid #7fafd6;height:55px;margin-bottom:4px'></div>")+'<div style="font-size:11px;color:#4a7aaa;font-weight:700">דייר</div></div>'
    +'</div></body></html>';
}

function printReport(tour,findings,sigs){
  // Force-save to localStorage before opening window (prevents data loss on page reload)
  try{localStorage.setItem("ideal_findings",JSON.stringify(findings));}catch(e){}
  try{localStorage.setItem("ideal_tours",JSON.stringify(tour));}catch(e){}
  var w=window.open("","_blank");
  if(w){w.document.write(buildReport(tour,findings,sigs));w.document.close();setTimeout(function(){w.print();},800);}
}

function shareReport(tour,findings,sigs){
  // Force-save to localStorage before opening window
  try{localStorage.setItem("ideal_findings",JSON.stringify(findings));}catch(e){}
  var html=buildReport(tour,findings,sigs);
  var w=window.open("","_blank");
  if(!w){alert("אפשר גישה לחלונות קופצים");return;}
  w.document.write(html);w.document.close();
  setTimeout(function(){
    var b=w.document.createElement("div");
    b.style.cssText="position:fixed;top:0;left:0;right:0;background:#1565c0;color:#fff;padding:11px 15px;font-family:Arial;font-size:14px;direction:rtl;z-index:9999;display:flex;justify-content:space-between;align-items:center;gap:10px";
    b.innerHTML='<span>📄 לשמירה כ-PDF: לחץ הדפס ← "שמור כ-PDF"</span><button onclick="window.print()" style="background:#fff;color:#1565c0;border:none;padding:7px 14px;border-radius:8px;font-weight:700;cursor:pointer;font-size:13px">🖨️ שמור PDF</button>';
    w.document.body.insertBefore(b,w.document.body.firstChild);
    w.document.body.style.paddingTop="55px";
  },600);
}

      e("button",{onClick:clr,style:{...BS,flex:1,padding:"10px"}},"🗑 נקה"),

function App(){
  var [view,setView]=useState("dashboard");

  var [extraAreas,setExtraAreas]=useState(function(){return lsGet("ideal_areas",[]);});
  var [extraUnits,setExtraUnits]=useState(function(){return lsGet("ideal_units",[]);});
  var [activeTour,setActiveTour]=useState(null);
  var [newF,setNewF]=useState(emptyF());
  var [showForm,setShowForm]=useState(false);
  var [showPicker,setShowPicker]=useState(false);
  var [showMgr,setShowMgr]=useState(false);
  var [selReport,setSelReport]=useState(null);
  var [delTourC,setDelTourC]=useState(null);

  var [filterSev,setFilterSev]=useState("הכל");
  var [nt,setNt]=useState({name:"",inspector:"",project:"",contractor:""});
  var [syncSt,setSyncSt]=useState("idle");
  var [repAddId,setRepAddId]=useState(null);
  var [repF,setRepF]=useState(emptyF());
  var syncTimer=useRef(null);
  var toursRef=useRef(tours);
  var findingsRef=useRef(findings);
  var sigsRef=useRef(sigs);
  var templatesRef=useRef(templates);
  var extraAreasRef=useRef(extraAreas);
  var extraUnitsRef=useRef(extraUnits);

  useEffect(function(){lsSet("ideal_tours",tours);toursRef.current=tours;},[tours]);
  useEffect(function(){lsSet("ideal_findings",findings);findingsRef.current=findings;},[findings]);
  useEffect(function(){lsSet("ideal_areas",extraAreas);extraAreasRef.current=extraAreas;},[extraAreas]);
  useEffect(function(){lsSet("ideal_units",extraUnits);extraUnitsRef.current=extraUnits;},[extraUnits]);
  useEffect(function(){lsSet("ideal_templates",templates);templatesRef.current=templates;},[templates]);

  function setSigs(upd){setSigsRaw(function(prev){var n=typeof upd==="function"?upd(prev):upd;lsSet("ideal_sigs",n);sigsRef.current=n;return n;});}

  // Auto-push removed - manual only for safety

  function getDB2(){
    try{if(!window._fb)window._fb=firebase.initializeApp(FB);return firebase.firestore(window._fb);}
    catch(err){try{return firebase.firestore();}catch{return null;}}
  }

  function pushToCloud(){
    var db=getDB2();if(!db){setSyncSt("error");return;}
    // Always read from localStorage - most reliable source of truth
    var safeTours=lsGet("ideal_tours",[]);
    var safeFindings=lsGet("ideal_findings",[]);
    var safeSigs=lsGet("ideal_sigs",{});
    var safeTemplates=lsGet("ideal_templates",[]);
    var safeAreas=lsGet("ideal_areas",[]);
    var safeUnits=lsGet("ideal_units",[]);
    // Safety check: never push empty data if we have data in memory
    if(safeFindings.length===0 && findingsRef.current.length>0){
      safeFindings=findingsRef.current;
    }
    if(safeTours.length===0 && toursRef.current.length>0){
      safeTours=toursRef.current;
    }
    setSyncSt("syncing");
    var data={
      tours:safeTours,
      findings:safeFindings,
      sigs:safeSigs,
      templates:safeTemplates,
      extraAreas:safeAreas,
      extraUnits:safeUnits,
      updatedAt:new Date().toISOString()
    };
    db.collection("users").doc("shared").set(data)
      .then(function(){setSyncSt("synced");setTimeout(function(){setSyncSt("idle");},2000);})
      .catch(function(){setSyncSt("error");});
  }

  function pullFromCloud(){
    var db=getDB2();if(!db){setSyncSt("error");return;}
    setSyncSt("syncing");
    db.collection("users").doc("shared").get().then(function(doc){
      if(doc.exists){
        var d=doc.data();
        var cn=(d.findings||[]).length,ln=lsGet("ideal_findings",[]).length;
        if(ln>cn){
          var ok=window.confirm("בענן יש "+cn+" ממצאים, במכשיר יש "+ln+". משיכה תחליף את הנתונים. להמשיך?");
          if(!ok){setSyncSt("idle");return;}
        }
        if(d.tours)setTours(d.tours);
        if(d.findings)setFindings(d.findings);
        if(d.sigs)setSigsRaw(d.sigs);
        if(d.templates)setTemplates(d.templates);
        if(d.extraAreas)setExtraAreas(d.extraAreas);
        if(d.extraUnits)setExtraUnits(d.extraUnits);
        setSyncSt("synced");setTimeout(function(){setSyncSt("idle");},3000);
      }else{pushToCloud();}
    }).catch(function(){setSyncSt("error");});
  }

  function startTour(){
    if(!nt.name.trim())return;
    var t={id:gid(),name:nt.name,inspector:nt.inspector,project:nt.project,contractor:nt.contractor,date:today(),time:nowt(),findings:[],status:"active"};
    setTours(function(p){return p.concat([t]);});setActiveTour(t);setNt({name:"",inspector:"",project:"",contractor:""});setView("tour");
  }
  function endTour(){if(!activeTour)return;setTours(function(p){return p.map(function(t){return t.id===activeTour.id?Object.assign({},t,{status:"closed"}):t;});});setActiveTour(null);}
  function resumeTour(t){setActiveTour(Object.assign({},t,{status:"active"}));setTours(function(p){return p.map(function(x){return x.id===t.id?Object.assign({},x,{status:"active"}):x;});});setView("tour");}
  function delTourFn(id){
    var newT=toursRef.current.filter(function(t){return t.id!==id;});
    var newF=findingsRef.current.filter(function(f){return f.tourId!==id;});
    setTours(newT);toursRef.current=newT;lsSet("ideal_tours",newT);
    setFindings(newF);findingsRef.current=newF;lsSet("ideal_findings",newF);
    setSelReport(null);
  }

  function addFinding(tourId,finding,done){
    if(!finding.description.trim())return;
    var tour=toursRef.current.find(function(t){return t.id===tourId;})||activeTour;
    var nf=Object.assign({},finding,{id:gid(),tourId:tour?tour.id:null,tourName:tour?tour.name:"",date:today()});
    var newFindings=findingsRef.current.concat([nf]);
    setFindings(newFindings);
    findingsRef.current=newFindings;
    lsSet("ideal_findings",newFindings); // immediate save
    if(tour){
      var u=Object.assign({},tour,{findings:tour.findings.concat([nf.id])});
      var newTours=toursRef.current.map(function(t){return t.id===tour.id?u:t;});
      setTours(newTours);
      toursRef.current=newTours;
      lsSet("ideal_tours",newTours); // immediate save
      if(activeTour&&activeTour.id===tour.id)setActiveTour(u);
    }
    done();
  }
  function delFinding(id){
    var newF=findingsRef.current.filter(function(f){return f.id!==id;});
    var newT=toursRef.current.map(function(t){return Object.assign({},t,{findings:t.findings.filter(function(fid){return fid!==id;})});});
    setFindings(newF);findingsRef.current=newF;lsSet("ideal_findings",newF);
    setTours(newT);toursRef.current=newT;lsSet("ideal_tours",newT);
  }
  function editFinding(id,data){
    var updated=findingsRef.current.map(function(f){return f.id===id?Object.assign({},f,data):f;});
    setFindings(updated);
    findingsRef.current=updated;
    lsSet("ideal_findings",updated);
  }
  function addExtraArea(a){if(AREAS.indexOf(a)===-1&&extraAreas.indexOf(a)===-1)setExtraAreas(function(p){return p.concat([a]);});}
  function addExtraUnit(u){if(ULOCS.indexOf(u)===-1&&extraUnits.indexOf(u)===-1)setExtraUnits(function(p){return p.concat([u]);});}

  var od=findings.filter(function(f){return f.status!=="סגור"&&overdue(f.deadline);}).length;
  var filtered=findings.filter(function(f){if(filterSt!=="הכל"&&f.status!==filterSt)return false;if(filterSev!=="הכל"&&f.severity!==filterSev)return false;return true;});
  var stats={total:findings.length,open:findings.filter(function(f){return f.status==="פתוח";}).length,crit:findings.filter(function(f){return f.severity==="קריטי";}).length,tours:tours.length};
  var actTours=tours.filter(function(t){return t.status==="active";});

  // Nav
  var navItems=[{id:"dashboard",l:"בקרה",ic:"📊"},{id:"tour",l:"סיור",ic:"👷"},{id:"findings",l:"ממצאים",ic:"📋"},{id:"report",l:"דוחות",ic:"📄"}];

  // Shared form renderer
  function renderForm(tourId,f,setF,onSave,onCancel){
    return e(FindingForm,{finding:f,onChange:setF,onSave:onSave,onCancel:onCancel,
      onTemplates:function(){setShowPicker(true);},extraAreas:extraAreas,onAddArea:addExtraArea,extraUnits:extraUnits,onAddUnit:addExtraUnit});
  }

  return e("div",{style:{fontFamily:"Heebo, Arial, sans-serif",direction:"rtl",minHeight:"100vh",background:"#e8f3fc",color:"#1e3a5f"}},
    showPicker&&e(TmplPicker,{templates:templates,onSelect:function(t){setNewF(function(f){return Object.assign({},f,{description:t.description,severity:t.severity,area:t.area});});setShowForm(true);},onManage:function(){setShowMgr(true);},onClose:function(){setShowPicker(false);}}),
    showMgr&&e(TmplMgr,{templates:templates,onUpdate:setTemplates,onClose:function(){setShowMgr(false);}}),
